 {title:'Повседневные глаголы',kz:'Күнделікті етістіктер',topic:'Present Simple',desc:'Рассказываем о привычках',explain:'Present Simple описывает привычки, расписания и факты. С I/you/we/they глагол обычно не меняется. С he/she/it добавь -s: She reads. Вопрос строится с do или does.',explainKz:'Present Simple әдет, кесте және тұрақты факт туралы айтады. I/you/we/they есімдіктерімен етістік өзгермейді. He/she/it болса, -s жалғанады: She reads. Сұрақ do немесе does арқылы жасалады.',words:['work','read','often','usually'],examples:[['We often walk after work.','Мы часто гуляем после работы.','Біз жұмыстан кейін жиі серуендейміз.'],['He reads every evening.','Он читает каждый вечер.','Ол күн сайын кешке кітап оқиды.']],test:'She ___ English every day.',testRu:'изучает',testKz:'үйренеді',options:['study','studies','studying'],answer:'studies',note:'С he/she/it в Present Simple в study меняется y на ies: studies.'},
 {title:'Что происходит сейчас?',kz:'Қазір не болып жатыр?',topic:'Present Continuous',desc:'Описываем действие в момент речи',explain:'Для действия, которое происходит сейчас, используй am/is/are + глагол с -ing: I’m reading. Вопрос: Are they working? Не забывай форму be — без неё конструкция неполная.',explainKz:'Дәл қазір болып жатқан әрекет үшін am/is/are + етістіктің -ing түрі қолданылады: I’m reading. Сұрақ: Are they working? Be формасын ұмытпа, онсыз сөйлем толық болмайды.',words:['read','work','write','listen'],examples:[['She is writing a message now.','Она сейчас пишет сообщение.','Ол қазір хабарлама жазып отыр.'],['We are learning English.','Мы изучаем английский.','Біз ағылшын тілін үйреніп жатырмыз.']],test:'I ___ to a podcast now.',testRu:'слушаю',testKz:'тыңдап отырмын',options:['listen','am listening','listens'],answer:'am listening',note:'С I нужна форма am, а действие получает окончание -ing.'},
 {title:'Мой день и время',kz:'Менің күнім және уақыт',topic:'Распорядок дня',desc:'Время, дни недели и частотность',explain:'Слова always, usually, often и sometimes обычно стоят перед смысловым глаголом: I often read. С be они ставятся после него: She is always kind. Для точного времени используй at, для дней — on.',explainKz:'Always, usually, often және sometimes сөздері мағыналық етістіктің алдында келеді: I often read. Ал be етістігінен кейін қойылады: She is always kind. Нақты уақыт үшін at, апта күндері үшін on қолданылады.',words:['morning','today','always','sometimes'],examples:[['I usually have breakfast at eight.','Я обычно завтракаю в восемь.','Мен әдетте сағат сегізде таңғы ас ішемін.'],['She is often busy on Monday.','По понедельникам она часто занята.','Дүйсенбіде оның қолы жиі бос болмайды.']],test:'We ___ walk in the morning.',testRu:'часто',testKz:'жиі',options:['often','are often','often are'],answer:'often',note:'Наречие частотности ставим перед обычным глаголом: We often walk.'},
 {title:'Еда и вежливые просьбы',kz:'Тағам және сыпайы өтініштер',topic:'В кафе',desc:'Заказываем, просим и благодарим',explain:'Could I have…? — вежливая просьба в кафе. Would you like…? — предложение собеседнику. Исчисляемые предметы в единственном числе обычно требуют a/an: an apple, a sandwich.',explainKz:'Could I have…? — дәмханада сыпайы өтініш. Would you like…? — әңгімелесушіге ұсыныс. Жекеше саналатын заттардың алдында көбіне a/an келеді: an apple, a sandwich.',words:['water','coffee','apple','breakfast'],examples:[['Could I have a coffee, please?','Можно мне кофе, пожалуйста?','Маған кофе бересіз бе?'],['Would you like an apple?','Хочешь яблоко?','Алма жейсің бе?']],test:'Could I have ___ apple?',testRu:'яблоко',testKz:'алма',options:['a','an','the'],answer:'an',note:'Перед apple, начинающимся с гласного звука, ставим an.'},
 {title:'Город и дорога',kz:'Қала және жол',topic:'Как найти дорогу',desc:'Спрашиваем маршрут и понимаем ответ',explain:'Where is…? спросит, где находится место. Go straight ahead — иди прямо, turn left/right — поверни налево/направо. Предлог next to означает «рядом», between — «между».',explainKz:'Where is…? деп орынның қайда екенін сұраймыз. Go straight ahead — тура жүр, turn left/right — солға/оңға бұрыл. Next to — «жанында», between — «арасында».',words:['city','street','station','map'],examples:[['The station is next to the bank.','Станция рядом с банком.','Бекет банктің жанында.'],['Turn left at the next street.','На следующей улице поверни налево.','Келесі көшеден солға бұрыл.']],test:'The café is ___ the bank and the park.',testRu:'между',testKz:'арасында',options:['between','under','into'],answer:'between',note:'Between связывает два ориентира: between the bank and the park.'}],
B:[
 {title:'Рассказываем о прошлом',kz:'Өткен шақ туралы айту',topic:'Past Simple',desc:'Завершённые события и их время',explain:'Past Simple описывает завершённое действие в прошлом. Правильные глаголы получают -ed (worked), неправильные имеют свою форму (went, saw). В вопросе используй did + начальную форму: Did you go?',explainKz:'Past Simple өткенде аяқталған әрекетті сипаттайды. Дұрыс етістікке -ed жалғанады (worked), бұрыс етістіктердің жеке формасы болады (went, saw). Сұрақта did + негізгі форма қолданылады: Did you go?',words:['travel','arrive','leave','journey'],examples:[['We arrived late yesterday.','Вчера мы приехали поздно.','Кеше біз кеш келдік.'],['Did you see the old town?','Ты видел старый город?','Ескі қаланы көрдің бе?']],test:'They ___ the museum last week.',testRu:'посетили',testKz:'барды',options:['visit','visited','visiting'],answer:'visited',note:'Last week указывает на завершённое прошлое: добавляем -ed.'},
 {title:'Момент в прошлом',kz:'Өткен шақтағы әрекет',topic:'Past Continuous',desc:'Действие в определённый момент',explain:'Past Continuous показывает процесс в конкретный момент прошлого: was/were + -ing. Часто соединяется с Past Simple: I was walking when it started to rain.',explainKz:'Past Continuous өткен шақтағы белгілі бір сәтте жүріп жатқан әрекетті көрсетеді: was/were + -ing. Көбіне Past Simple-пен бірге келеді: I was walking when it started to rain.',words:['rain','walk','listen','while'],examples:[['She was reading at nine.','В девять она читала.','Сағат тоғызда ол кітап оқып отырды.'],['We were waiting when the bus arrived.','Мы ждали, когда приехал автобус.','Автобус келгенде біз күтіп тұрдық.']],test:'I ___ home when you called.',testRu:'шла домой',testKz:'үйге бара жатқан едім',options:['walked','was walking','am walking'],answer:'was walking',note:'Действие шло во время звонка: I was walking.'},
 {title:'Планы и прогнозы',kz:'Жоспарлар мен болжамдар',topic:'Future forms',desc:'Говорим о том, что будет дальше',explain:'Will часто выражает решение в момент речи и прогноз: I’ll help; It will rain. Для заранее решённого плана подходит be going to. Договорённость с указанием времени часто описывают Present Continuous.',explainKz:'Will көбіне дәл қазір қабылданған шешім мен болжамды білдіреді: I’ll help; It will rain. Алдын ала құрылған жоспар үшін be going to қолданылады. Уақыты белгілі келісімді Present Continuous арқылы айтамыз.',words:['plan','travel','tomorrow','perhaps'],examples:[['I think the weather will improve.','Думаю, погода улучшится.','Ауа райы жақсарады деп ойлаймын.'],['We are meeting at six.','Мы встречаемся в шесть.','Біз сағат алтыда кездесеміз.']],test:'Look at those clouds. It ___ rain.',testRu:'собирается пойти дождь',testKz:'жаңбыр жауғалы тұр',options:['will','is going to','was'],answer:'is going to',note:'Видимые признаки (тёмные облака) часто поддерживают прогноз be going to.'},
 {title:'Опыт и результат',kz:'Тәжірибе және нәтиже',topic:'Present Perfect',desc:'Связываем прошлое с настоящим',explain:'Present Perfect = have/has + третья форма глагола. Используй его для опыта без точного времени и результата, важного сейчас: I’ve lost my keys. С указанием завершённого времени выбирай Past Simple.',explainKz:'Present Perfect = have/has + етістіктің үшінші формасы. Нақты уақыт айтылмайтын тәжірибе мен қазір маңызды нәтижеге қолданылады: I’ve lost my keys. Аяқталған уақыт көрсетілсе, Past Simple таңда.',words:['already','yet','since','experience'],examples:[['Have you ever visited London?','Ты когда-нибудь был в Лондоне?','Лондонда болып көрдің бе?'],['I have already sent the email.','Я уже отправил письмо.','Мен хатты әлдеқашан жібердім.']],test:'She ___ here since May.',testRu:'живет здесь с мая',testKz:'мамырдан бері тұрады',options:['lived','has lived','is living'],answer:'has lived',note:'Since May — отрезок, продолжающийся до настоящего; she + has lived.'},
 {title:'Сравниваем и выбираем',kz:'Салыстыру және таңдау',topic:'Сравнительные формы',desc:'Сравнительная и превосходная степень',explain:'Короткие прилагательные чаще получают -er/-est: smaller, the smallest. Длинные используют more/most: more comfortable, the most useful. Не добавляй обе формы одновременно.',explainKz:'Қысқа сын есімдерге көбіне -er/-est жалғанады: smaller, the smallest. Ұзындарына more/most қосылады: more comfortable, the most useful. Екі тәсілді қатар қолданба.',words:['better','comfortable','quiet','crowded'],examples:[['This route is shorter than the old one.','Этот маршрут короче прежнего.','Бұл бағыт бұрынғысынан қысқа.'],['It is the most comfortable seat.','Это самое удобное место.','Бұл — ең жайлы орын.']],test:'This café is ___ than the one near work.',testRu:'тише',testKz:'тынышырақ',options:['quiet','quieter','more quietest'],answer:'quieter',note:'Quiet — короткое прилагательное: добавляем -er.'},
 {title:'Совет, возможность и правило',kz:'Кеңес, мүмкіндік және міндет',topic:'Modal verbs',desc:'Can, should, must и have to',explain:'Модальные глаголы сопровождаются основной формой без to: You should rest. Should даёт совет, can — способность или разрешение, must — сильную необходимость. Have to часто описывает внешнее правило.',explainKz:'Модаль етістіктен кейін to-сыз негізгі етістік келеді: You should rest. Should — кеңес, can — қабілет не рұқсат, must — күшті қажеттілік. Have to көбіне сыртқы ережені білдіреді.',words:['need','help','possible','necessary'],examples:[['You should take a short break.','Тебе стоит сделать небольшой перерыв.','Қысқа үзіліс жасағаның дұрыс.'],['You must show your ticket.','Нужно показать билет.','Билетіңді көрсетуің керек.']],test:'You ___ wear a seat belt in the car.',testRu:'должен по правилу',testKz:'тағуың керек',options:['must to','have to','should to'],answer:'have to',note:'После have to идёт инфинитив без изменений: have to wear.'},
 {title:'Устойчивые сочетания',kz:'Тұрақты сөз тіркестері',topic:'Phrasal verbs',desc:'Знакомые слова — новый смысл',explain:'Фразовый глагол соединяет глагол и частицу: find out — выяснить, look after — заботиться. Не всегда можно угадать смысл по частям; учи выражение вместе с коротким примером и контекстом.',explainKz:'Фразалық етістік етістік пен шылаудан құралады: find out — анықтап білу, look after — қамқор болу. Мағынасын бөліктерден үнемі болжай алмайсың; тіркесті контекстегі мысалмен бірге үйрен.',words:['find out','look after','give up','carry on'],examples:[['We found out the train time.','Мы узнали время отправления поезда.','Пойыз уақытын анықтап алдық.'],['She looks after her little sister.','Она заботится о младшей сестре.','Ол сіңлісіне қамқор болады.']],test:'Don’t ___ — try one more time.',testRu:'сдавайся',testKz:'берілме',options:['give up','look after','find out'],answer:'give up',note:'Give up означает прекратить попытки или сдаться.'}],
C:[
 {title:'Точные оттенки времени',kz:'Шақтардың мағыналық реңкі',topic:'Продвинутые времена',desc:'Выбираем время по смыслу и контексту',explain:'Past Simple называет завершённый эпизод. Present Perfect связывает результат или опыт с настоящим. Present Perfect Continuous подчёркивает длительность: I’ve been working here for years. Контекст важнее механического маркера.',explainKz:'Past Simple аяқталған оқиғаны атайды. Present Perfect нәтиже не тәжірибені қазіргімен байланыстырады. Present Perfect Continuous ұзақтықты көрсетеді: I’ve been working here for years. Дайын сөзге емес, контекске сүйен.',words:['since','for','already','experience'],examples:[['She has worked here for five years.','Она работает здесь пять лет.','Ол мұнда бес жыл жұмыс істеп келеді.'],['She worked there in 2020.','Она работала там в 2020 году.','Ол 2020 жылы сонда жұмыс істеді.']],test:'I ___ on this report all morning, and it is nearly ready.',testRu:'работаю над отчётом всё утро',testKz:'есеппен таңнан бері жұмыс істеп жатырмын',options:['worked','have been working','am working'],answer:'have been working',note:'Действие длится всё утро и продолжается сейчас — длительный Present Perfect Continuous.'},
 {title:'Условия и последствия',kz:'Шарт және нәтиже',topic:'Conditionals',desc:'Гипотезы от фактов до воображения',explain:'Zero conditional описывает закономерность (If you heat ice, it melts). First — реальную возможность в будущем. Second — воображаемую ситуацию сейчас или позже. В условной части обычно не ставь will.',explainKz:'Zero conditional тұрақты заңдылықты айтады. First — болашақтағы шынайы мүмкіндікті. Second — қазір не болашақтағы қиялдағы жағдайды. Шарт бөлігінде әдетте will қолданылмайды.',words:['unless','perhaps','change','possible'],examples:[['If you leave now, you’ll catch the train.','Если ты выйдешь сейчас, успеешь на поезд.','Қазір шықсаң, пойызға үлгересің.'],['If I had more time, I would read more.','Если бы у меня было больше времени, я бы больше читал.','Уақытым көбірек болса, көп оқыр едім.']],test:'If she ___ more time, she would join us.',testRu:'если бы у неё было больше времени',testKz:'уақыты көбірек болса',options:['has','had','will have'],answer:'had',note:'Воображаемая ситуация: if + Past Simple, затем would + глагол.'},
 {title:'Деликатно передаём чужие слова',kz:'Біреудің сөзін сыпайы жеткізу',topic:'Косвенная речь',desc:'Сообщаем, о чём говорили',explain:'В косвенной речи местоимения меняются по контексту, а время часто сдвигается назад: “I’m tired” → She said she was tired. Вопрос передаётся порядком утверждения: He asked where I lived.',explainKz:'Жанама сөйлеуде есімдік контекстке қарай өзгереді, ал шақ көбіне бір қадам кейін шегінеді: “I’m tired” → She said she was tired. Сұрақта сөз тәртібі хабарлы сөйлемдегідей: He asked where I lived.',words:['say','tell','ask','explain'],examples:[['“I can help.” → He said he could help.','«Я могу помочь». → Он сказал, что сможет помочь.','«Мен көмектесе аламын». → Ол көмектесе алатынын айтты.'],['“Where is the station?” → She asked where the station was.','«Где станция?» → Она спросила, где станция.','«Бекет қайда?» → Ол бекеттің қайда екенін сұрады.']],test:'“I work here.” → She said she ___ there.',testRu:'работает там',testKz:'сонда жұмыс істейтінін',options:['works','worked','has worked'],answer:'worked',note:'После said о прошлом в косвенной речи часто используем Past Simple.'},
 {title:'Естественный ритм фраз',kz:'Табиғи сөйлеу ырғағы',topic:'Идиомы и collocations',desc:'Звучим свободнее, не переводя дословно',explain:'Английские слова часто встречаются в устойчивых сочетаниях: make a decision, take a break, pay attention. Идиома получает переносное значение. Замечай такие сочетания в чтении и учи их как одно целое.',explainKz:'Ағылшын сөздері тұрақты тіркестерде жиі кездеседі: make a decision, take a break, pay attention. Идиомаларда ауыспалы мағына болады. Мұндай тіркестерді мәтіннен байқап, тұтас үйрен.',words:['decision','make a decision','take a break','pay attention'],examples:[['Let’s take a break before the next section.','Давайте сделаем перерыв перед следующим разделом.','Келесі бөлімге дейін үзіліс жасайық.'],['Please pay attention to the final paragraph.','Обрати внимание на последний абзац.','Соңғы абзацқа назар аударшы.']],test:'We need to ___ before Friday.',testRu:'принять решение',testKz:'шешім қабылдау',options:['do a decision','make a decision','take a decision'],answer:'make a decision',note:'Нормативное сочетание — make a decision.'},
 {title:'Убеждаем и аргументируем',kz:'Ойды дәлелдеп жеткізу',topic:'Связки и аргументация',desc:'Строим связный и убедительный ответ',explain:'Сначала сформулируй позицию, затем причину и пример. Use because для причины, however для контраста, therefore для вывода. В формальном тексте избегай избыточных повторов и поддерживай утверждения примерами.',explainKz:'Алдымен пікіріңді айт, содан кейін себебі мен мысалын келтір. Себепке because, қарама-қарсылыққа however, қорытындыға therefore қолдан. Ресми мәтінде сөзді орынсыз қайталама, ойыңды мысалмен негізде.',words:['opinion','reason','evidence','however'],examples:[['In my opinion, public libraries still matter.','По моему мнению, общественные библиотеки по-прежнему важны.','Меніңше, қоғамдық кітапханалардың маңызы әлі де зор.'],['The evidence is limited; however, the pattern is clear.','Данных мало, однако закономерность очевидна.','Дәлел аз, алайда үрдіс анық.']],test:'The sample was small; ___, the result is promising.',testRu:'однако',testKz:'алайда',options:['because','however','unless'],answer:'however',note:'Однако вводит контраст с предыдущей частью.'},
 {title:'Вежливый профессиональный стиль',kz:'Іскерлік қарым-қатынастағы сыпайы стиль',topic:'Деловой английский',desc:'Пишем ясные письма и договорённости',explain:'Could you…? и Would it be possible to…? смягчают просьбу. Короткое письмо строится просто: контекст, конкретная просьба, срок и вежливое завершение. Be available означает «быть свободным/доступным», а не «доступный по цене».',explainKz:'Could you…? және Would it be possible to…? өтінішті жұмсартады. Қысқа хатта контекст, нақты өтініш, мерзім және сыпайы аяқтау болады. Be available — «бос/қолжетімді» деген мағынада, «арзан» емес.',words:['available','colleague','deadline','suggestion'],examples:[['Would you be available for a short call on Thursday?','Ты сможешь созвониться в четверг?','Бейсенбіде қысқа қоңырауға уақытың бола ма?'],['Could you send the draft by noon?','Не мог бы ты прислать черновик к полудню?','Жобаны түске дейін жібере аласың ба?']],test:'___ you be available for a call tomorrow?',testRu:'не могли бы вы',testKz:'мүмкіндігіңіз бар ма',options:['Do','Could','Are'],answer:'Could',note:'Could you…? — вежливая форма просьбы.'},
 {title:'Смысл между строк',kz:'Жасырын мағына мен стиль',topic:'Нюансы и регистр',desc:'Выбираем формулировку под ситуацию',explain:'Одну мысль можно выразить разговорно, нейтрально или формально. Kids и children близки по значению, но различаются по тону. Phrasal verbs часто естественны в разговоре; однословные альтернативы могут звучать официальнее. Всегда учитывай аудиторию.',explainKz:'Бір ойды ауызекі, бейтарап немесе ресми түрде жеткізуге болады. Kids пен children мағынасы жақын, бірақ стилі бөлек. Фразалық етістіктер ауызекі тілде табиғи, бір сөздік баламалары ресми естілуі мүмкін. Тыңдаушыны ескер.',words:['community','although','perhaps','in fact'],examples:[['We need to find out what happened.','Нужно выяснить, что произошло.','Не болғанын анықтау керек.'],['The report indicates what occurred.','В отчёте указано, что произошло.','Есепте не болғаны көрсетілген.']],test:'Which opening sounds most formal in a work email?',testRu:'формальный вариант',testKz:'ресми нұсқа',options:['Hi! Quick question.','I am writing to enquire about…','Hey, what’s up?'],answer:'I am writing to enquire about…',note:'I am writing to enquire about… — формальный стиль; два других варианта разговорные.'},
 {title:'Читаем и замечаем структуру',kz:'Оқу және мәтін құрылымын байқау',topic:'Стратегии чтения',desc:'Находим главную мысль и аргументы',explain:'Перед чтением посмотри на заголовок и первый абзац — это подскажет тему. В каждом абзаце найди основное утверждение; затем отдели пример от доказательства. Не останавливайся на каждом незнакомом слове, если смысл ясен.',explainKz:'Оқудан бұрын тақырып пен бірінші абзацқа көз жүгірт — олар мәтіннің бағытын аңғартады. Әр абзацтан негізгі ойды тауып, мысал мен дәлелді ажырат. Мағынасы түсінікті болса, әр бейтаныс сөзге тоқтама.',words:['article','purpose','evidence','research'],examples:[['The article argues that regular rest improves focus.','В статье утверждается, что регулярный отдых улучшает концентрацию.','Мақалада тұрақты демалыс зейінді жақсартатыны айтылады.'],['For example, short breaks reduce fatigue.','Например, короткие перерывы снижают усталость.','Мысалы, қысқа үзіліс шаршауды азайтады.']],test:'A paragraph’s main claim is usually its…',testRu:'основная мысль',testKz:'негізгі ойы',options:['main point','page number','footnote'],answer:'main point',note:'Сначала найди основное утверждение; детали и примеры обычно его поддерживают.'},
 {title:'Ясное и выразительное письмо',kz:'Түсінікті әрі әсерлі жазу',topic:'Письмо и стиль',desc:'Развиваем абзац и проверяем тон',explain:'Сильный абзац держится на одном фокусе: мысль, объяснение, пример, связь с темой. Меняй длину предложений, но не перегружай текст придаточными. В конце проверь согласование времён, артикли и естественные сочетания.',explainKz:'Жақсы абзац бір ойға құрылады: пікір, түсіндірме, мысал және тақырыппен байланыс. Сөйлем ұзындығын өзгертіп отыр, бірақ бағыныңқы сөйлемді көбейтпе. Соңында шақтарды, артикльдерді және сөз тіркестерін тексер.',words:['describe','develop','improve','purpose'],examples:[['This approach is useful because it gives learners clear feedback.','Этот подход полезен, потому что учащиеся получают понятную обратную связь.','Бұл тәсіл пайдалы, себебі үйренушілерге түсінікті кері байланыс береді.'],['As a result, they can improve with confidence.','В результате они могут увереннее двигаться вперёд.','Нәтижесінде олар сенімді түрде жақсара алады.']],test:'A clear paragraph should focus on…',testRu:'одна основная мысль',testKz:'бір негізгі ой',options:['several unrelated topics','one main idea','the longest possible sentence'],answer:'one main idea',note:'Один абзац легче читать, когда он развивает одну центральную мысль.'}

const dedupWords=words.filter((w,i,a)=>a.findIndex(x=>x.en.toLowerCase()===w.en.toLowerCase()&&x.ru===w.ru&&x.kz===w.kz)===i);
const defaultState={lang:'ru',page:'home',activeRoute:'A',activeLesson:null,completed:[],attempts:[],history:[],review:{},favorites:[],customWords:[],games:{},goal:10,studySeconds:0,filter:'all'};
function readState(){try{const s=JSON.parse(localStorage.getItem('piship-v1'));return s?{...defaultState,...s,review:s.review||{},games:s.games||{},customWords:s.customWords||[]}:structuredClone(defaultState)}catch{return structuredClone(defaultState)}}
let S=readState();let practiceQueue=[],practiceIndex=0,practiceResult=null,practiceBuildSelection=[],reviewSession=false,vocabSearch='',vocabCategory='all',vocabLevel='all',vocabFilter='all',game=null,gameTimer=null,memoryWait=null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)], t=k=>STRINGS[S.lang][k]??STRINGS.ru[k]??k, escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tr(obj,key='ru'){return obj[key]??obj.ru??''}function save(){try{localStorage.setItem('piship-v1',JSON.stringify(S))}catch{toast('Сохранение недоступно в этом режиме браузера.')}}
function allWords(){return [...dedupWords,...S.customWords]}function wordByText(x){return allWords().find(w=>w.en.toLowerCase()===String(x).toLowerCase())}
function dayKey(d=new Date()){return d.toISOString().slice(0,10)}function todayActions(){return S.history.filter(h=>h.day===dayKey()&&['answer','lesson','game','review'].includes(h.kind)).length}
function completedCount(route){return (LESSONS[route]||[]).filter(l=>S.completed.includes(lessonId(route,l))).length}function lessonId(route,l){return route+':'+l.title}
function activeLessonForHome(){for(const r of ['A','B','C']){const n=(LESSONS[r]||[]).find(l=>!S.completed.includes(lessonId(r,l)));if(n)return{route:r,lesson:n}}return{route:'C',lesson:LESSONS.C.at(-1)}}
function recordHistory(kind,data={}){const now=new Date();S.history.unshift({kind,day:dayKey(now),time:now.toLocaleTimeString(S.lang==='ru'?'ru-RU':'kk-KZ',{hour:'2-digit',minute:'2-digit'}),...data});S.history=S.history.slice(0,180);save()}
function updateStreak(){const days=[...new Set(S.history.map(h=>h.day))].sort().reverse();if(!days.length)return 0;const today=dayKey(),yesterday=dayKey(new Date(Date.now()-86400000));if(days[0]!==today&&days[0]!==yesterday)return 0;let n=1,last=new Date(days[0]+'T12:00:00');for(let i=1;i<days.length;i++){const d=new Date(days[i]+'T12:00:00');if((last-d)===86400000){n++;last=d}else break}return n}
function recordAnswer(w,ok,kind='answer'){S.attempts.push({day:dayKey(),word:w?.en||'',cat:w?.cat||'common',ok});if(S.attempts.length>500)S.attempts.shift();if(w){const r=S.review[w.id]||{seen:0,correct:0,streak:0,interval:0,due:0};r.seen++;if(ok){r.correct++;r.streak++;r.interval=r.streak<=1?1:r.streak===2?3:Math.min(60,Math.round((r.interval||3)*2.2))}else{r.streak=0;r.interval=.014}r.due=Date.now()+r.interval*86400000;S.review[w.id]=r}recordHistory(kind,{label:w?.en||t('practiceShort'),ok})}
function levelText(l){return t(levelKey[l]||'beginnerLevel')}
function topicKz(x){return({'Произношение':'Айтылым','Первые фразы':'Алғашқы тіркестер','I am, you are':'I am, you are','Present Simple':'Present Simple','Present Continuous':'Present Continuous','Распорядок дня':'Күн тәртібі','В кафе':'Дәмханада','Как найти дорогу':'Жолды қалай табуға болады','Past Simple':'Past Simple','Past Continuous':'Past Continuous','Future forms':'Келер шақ формалары','Present Perfect':'Present Perfect','Сравнительные формы':'Салыстыру формалары','Modal verbs':'Модаль етістіктер','Phrasal verbs':'Фразалық етістіктер','Продвинутые времена':'Күрделі шақтар','Conditionals':'Шартты сөйлемдер','Косвенная речь':'Жанама сөйлеу','Идиомы и collocations':'Идиомалар мен тұрақты тіркестер','Связки и аргументация':'Байланыстырғыш сөздер мен дәлел','Деловой английский':'Іскерлік ағылшын тілі','Нюансы и регистр':'Мағына реңкі мен стиль','Стратегии чтения':'Оқу стратегиялары','Письмо и стиль':'Жазу және стиль'})[x]||x}
function posName(x){const m={noun:['сущ.','зат есім'],verb:['глаг.','етістік'],adj:['прил.','сын есім'],adv:['нареч.','үстеу'],prep:['предлог','септеулік'],conj:['союз','жалғаулық'],interj:['межд.','одағай'],phrase:['выраж.','тіркес'],idiom:['идиома','идиома'],collocation:['сочетание','тіркес'],'phr.v':['фраз. глаг.','фразалық етістік']};return m[x]?.[S.lang==='ru'?0:1]||x}
function ruleFor(l){const rules={'I am, you are':'I am · you are · he/she/it is','Present Simple':'I/you/we/they + verb · he/she/it + verb-s','Present Continuous':'am / is / are + verb-ing','Распорядок дня':'always · usually · often · sometimes','В кафе':'a + consonant sound · an + vowel sound','Как найти дорогу':'Where is…? · next to · between','Past Simple':'regular verb + -ed · irregular past form','Past Continuous':'was / were + verb-ing','Future forms':'will + verb · be going to · present continuous','Present Perfect':'have / has + past participle','Сравнительные формы':'short adjective + -er · more + long adjective','Modal verbs':'modal verb + base form (no to)','Phrasal verbs':'verb + particle = contextual meaning','Продвинутые времена':'choose by meaning, time reference and context','Conditionals':'if + present, will + verb · if + past, would + verb','Косвенная речь':'reported statement · pronoun and tense shift','Идиомы и collocations':'learn the complete expression in context','Связки и аргументация':'claim → reason → evidence → conclusion','Деловой английский':'polite request · clear action · useful deadline','Нюансы и регистр':'audience + purpose determine tone','Стратегии чтения':'main idea → supporting reason → example','Письмо и стиль':'one paragraph · one central idea'};return rules[l.topic]||l.topic}

9" stroke="#f1eadb" stroke-width="2"><circle cx="98" cy="187" r="5"/><circle cx="245" cy="153" r="5"/><circle cx="356" cy="170" r="5"/><circle cx="500" cy="148" r="6" class="map-pulse"/></g><g fill="#776f5d" font-family="Georgia,serif" font-size="10"><text x="76" y="208">01 · ${t('markStart')}</text><text x="225" y="132">02 · ${t('markDiscover')}</text><text x="460" y="127">03 · ${t('markRefine')}</text></g><g transform="translate(551 225)" stroke="#8e8063" fill="none"><circle r="24" stroke-width=".7"/><circle r="2" fill="#ad9160"/><path d="M0 -20L4 -3 0 0 -4 -3Z M0 20L-3 3 0 0 3 3Z M-20 0L-3 -3 0 0 -3 3Z M20 0L3 3 0 0 3 -3Z" stroke-width=".8"/><text x="-2.5" y="-28" stroke="none" fill="#776f5d" font-size="7">N</text></g></svg><div class="map-bottom"><span>${t('markCaption')}</span><span>${t('levelStart')}　⌁</span></div></div></div>`;
 h+=`<div class="stats-grid">${statCard('words',Object.keys(S.review).filter(id=>S.review[id]?.correct>0).length,'⌁')}${statCard('lessons',S.completed.length,'◌')}${statCard('accuracy',S.attempts.length?Math.round(S.attempts.filter(a=>a.ok).length/S.attempts.length*100):0,'↗',S.attempts.length?'%':'')}${statCard('minutes',Math.round((S.attempts.length*1.4+S.history.filter(x=>x.kind==='lesson').length*7)),'◷')}</div>`;
 h+=`<div class="dashboard-grid"><div class="card continue-card"><div><div class="eyebrow">${t('continueLesson')}</div><h3>${allDone?'A wider horizon':escapeHtml(S.lang==="ru"?current.lesson.title:current.lesson.kz)}</h3><p>${allDone?t('completed'):routeName(current.route)+' · '+(S.lang==="ru"?current.lesson.topic:topicKz(current.lesson.topic))}</p><button class="btn" data-action="continue">${allDone?t('open'):t('continue')}</button></div><div class="card-ornament"><div class="compass-large">✳</div></div></div><div class="card word-day"><div class="word-day-top"><span class="eyebrow">${t('wordOfDay')}</span><span class="tag">${levelText(wd.level)}</span></div><div><h3>${escapeHtml(wd.en)}</h3><div class="phonetic">${escapeHtml(wd.ipa)} <button class="quiet-link" data-action="speak" data-text="${escapeHtml(wd.en)}"><svg class="sound-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><g class="sound-waves" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 9a5 5 0 0 1 0 6"/><path d="M18 6a9 9 0 0 1 0 12"/></g></svg> ${t('speak')}</button></div><div class="translation">${escapeHtml(S.lang==='ru'?wd.ru:wd.kz)}</div></div><div class="card-actions"><button class="icon-btn fav ${S.favorites.includes(wd.id)?'on':''}" data-action="favorite" data-id="${wd.id}" title="${t('saveWord')}">${S.favorites.includes(wd.id)?'★':'☆'}</button><button class="icon-btn" data-action="speak" data-text="${escapeHtml(wd.en)}" title="${t('speak')}"><svg class="sound-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><g class="sound-waves" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 9a5 5 0 0 1 0 6"/><path d="M18 6a9 9 0 0 1 0 12"/></g></svg></button></div></div></div>`;
 h+=`<div class="lower-grid"><div class="card activity-card"><div class="section-heading"><div><h2>${t('activity')}</h2></div><button class="quiet-link" data-action="go" data-page="progress">${t('seeAll')}</button></div>${recents.length?`<div class="activity-list">${recents.map(activityRow).join('')}</div>`:`<div class="empty-state" style="padding:14px 10px"><div class="empty-icon">⌁</div><div>${t('noActivity')}</div></div>`}</div><div class="quote-card card"><div class="eyebrow">${t('dailyQuote')}</div><blockquote>${t('quote')}</blockquote><p>${S.lang==='ru'?t('quoteRu'):t('quoteKz')}</p><p class="quote-by">— PISHIP logbook</p></div></div>`;return h}
function activityRow(h){const lbl=h.kind==='lesson'?t('lessonDone'):h.kind==='game'?t('games'):h.kind==='review'?t('reviewComplete'):t('practiceShort');return`<div class="activity-row"><div class="activity-symbol">${h.kind==='lesson'?'✓':h.kind==='game'?'♧':h.kind==='review'?'↺':'✳'}</div><div><strong>${escapeHtml(h.label||lbl)}</strong><small>${lbl}${h.ok===false?' · '+t('incorrect'):''}</small></div><span class="activity-end">${h.time||''}</span></div>`}

function learnPage(){if(S.activeLesson)return lessonDetailPage();const routes=[['A','beginner','beginnerDesc','⌁'],['B','intermediate','intermediateDesc','⌖'],['C','advanced','advancedDesc','✳']];return`<div class="section-heading"><div><div class="eyebrow">${t('paths')}</div><h1 class="page-title">${t('learningTitle')}</h1><p>${t('learningLead')}</p></div></div><div class="learn-layout"><div class="card route-list">${routes.map(([id,n,d,ic])=>{const pct=Math.round(completedCount(id)/LESSONS[id].length*100);return`<div class="route-card ${S.activeRoute===id?'active':''}" data-action="route" data-route="${id}"><div class="route-head"><strong>${t(n)}</strong><span>${ic}</span></div><p>${t(d)}</p><div class="route-progress"><span style="width:${pct}%"></span></div></div>`}).join('')}</div><div class="card lesson-panel"><div class="lesson-panel-head"><div><div class="eyebrow">${t('paths')} · ${escapeHtml(routeName(S.activeRoute))}</div><h2>${t(({A:'beginner',B:'intermediate',C:'advanced'})[S.activeRoute])}</h2><p>${t(({A:'beginnerDesc',B:'intermediateDesc',C:'advancedDesc'})[S.activeRoute])}</p></div><span class="tag dark">${t('currentRoute')}</span></div><div class="lesson-list">${LESSONS[S.activeRoute].map((l,i)=>{const done=S.completed.includes(lessonId(S.activeRoute,l));return`<div class="lesson-item ${done?'done':''}" data-action="lesson" data-index="${i}"><div class="lesson-num">${done?'✓':String(i+1).padStart(2,'0')}</div><div><h3>${escapeHtml(S.lang==='ru'?l.title:l.kz)}</h3><p>${escapeHtml(S.lang==='ru'?l.desc:topicKz(l.topic))} · ${escapeHtml(S.lang==='ru'?l.topic:topicKz(l.topic))}</p></div><span class="lesson-time">${10+i*2} ${t('minutesLabel')} &nbsp; ›</span></div>`}).join('')}</div></div></div>`}
function lessonDetailPage(){const {route,index}=S.activeLesson;const l=LESSONS[route][index];if(!l){S.activeLesson=null;return learnPage()}const done=S.completed.includes(lessonId(route,l));const examples=l.examples.map(e=>`<div class="example"><strong>${escapeHtml(e[0])}<button class="quiet-link" data-action="speak" data-text="${escapeHtml(e[0])}"><svg class="sound-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><g class="sound-waves" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 9a5 5 0 0 1 0 6"/><path d="M18 6a9 9 0 0 1 0 12"/></g></svg></button></strong><p>${escapeHtml(e[S.lang==='ru'?1:2])}</p></div>`).join('');const vocab=l.words.map(x=>{const w=wordByText(x);return`<div><strong>${escapeHtml(x)}</strong><small>${escapeHtml(w?(S.lang==='ru'?w.ru:w.kz):'')}</small></div>`}).join('');return`<div class="lesson-detail"><button class="back-link" data-action="back-learn">${t('back')}</button><div class="eyebrow">${escapeHtml(routeName(route))} · ${escapeHtml(S.lang==='ru'?l.topic:topicKz(l.topic))}</div><div class="lesson-title-row"><div><h1>${escapeHtml(S.lang==='ru'?l.title:l.kz)}</h1><p class="lead">${escapeHtml(S.lang==='ru'?l.desc:topicKz(l.topic))}</p></div><span class="tag">${done?'✓ ':''}${t('lesson')} ${index+1}</span></div><div class="lesson-body"><article class="card lesson-content"><div class="eyebrow">${t('explanation')}</div><h2>${escapeHtml(S.lang==='ru'?l.topic:topicKz(l.topic))}</h2><p>${escapeHtml(S.lang==='ru'?l.explain:l.explainKz)}</p><div class="rule-box">${escapeHtml(ruleFor(l))}</div><div class="eyebrow" style="margin-top:20px">${t('examples')}</div><div class="example-list">${examples}</div><div class="lesson-check"><h3>${t('check')}</h3><p>${t('checkPrompt')}</p><p><strong>${escapeHtml(S.lang==='ru'?(l.testRu||l.test):(l.testKz||l.test))}</strong></p><div class="exercise-options">${(l.options||[l.answer,l.examples[0][0],'was']).map(opt=>`<button class="choice" data-action="lesson-answer" data-answer="${escapeHtml(opt)}" data-correct="${escapeHtml(l.answer||l.examples[0][0])}">${escapeHtml(opt)}</button>`).join('')}</div><div id="lessonFeedback"></div></div><div style="margin-top:16px;display:flex;justify-content:end"><button class="btn" data-action="finish-lesson" data-route="${route}" data-index="${index}">${done?'✓ '+t('lessonDone'):t('completeLesson')}</button></div></article><aside class="card lesson-aside"><h3>${t('newWords')}</h3><div class="vocab-mini">${vocab}</div><div class="notice">${t('dailyHint')}</div><button class="btn secondary small" data-action="go" data-page="practice">${t('practiceShort')} →</button></aside></div></div>`}

function vocabPage(){const list=filteredWords();return`<div class="section-heading"><div><div class="eyebrow">${t('personal')}</div><h1 class="page-title">${t('vocabTitle')}</h1><p>${t('vocabLead')}</p></div><button class="btn" data-action="add-word">＋ ${t('addWord')}</button></div><div class="toolbar"><div class="searchbox"><span>⌕</span><input id="vocabSearch" type="search" placeholder="${t('search')}" value="${escapeHtml(vocabSearch)}"></div><select class="filter-select" id="vocabCategory"><option value="all">${t('allCategories')}</option>${CATS.map(c=>`<option value="${c}" ${vocabCategory===c?'selected':''}>${t(c)}</option>`).join('')}</select><select class="filter-select" id="vocabLevel"><option value="all">${t('allLevels')}</option>${['A','B','C'].map(l=>`<option value="${l}" ${vocabLevel===l?'selected':''}>${levelText(l)}</option>`).join('')}</select><select class="filter-select" id="vocabFilter"><option value="all">${t('allWords')}</option><option value="favorite" ${vocabFilter==='favorite'?'selected':''}>${t('favorites')}</option><option value="studied" ${vocabFilter==='studied'?'selected':''}>${t('studied')}</option></select></div><div id="wordCount" style="font-size:9px;color:var(--muted);margin:-7px 0 13px">${list.length} ${t('shown')} · ${allWords().length} ${t('words').toLowerCase()}</div><div class="word-list">${list.length?list.map(wordRow).join(''):`<div class="empty-state"><div class="empty-icon">⌕</div><h3>${t('empty')}</h3><div>${t('emptyHint')}</div></div>`}</div>`}
function filteredWords(){return allWords().filter(w=>{const q=vocabSearch.trim().toLowerCase();const found=!q||[w.en,w.ru,w.kz,w.ex].some(x=>String(x||'').toLowerCase().includes(q));const cat=vocabCategory==='all'||w.cat===vocabCategory;const lev=vocabLevel==='all'||w.level===vocabLevel;const f=vocabFilter==='all'||(vocabFilter==='favorite'&&S.favorites.includes(w.id))||(vocabFilter==='studied'&&(S.review[w.id]?.correct||0)>0);return found&&cat&&lev&&f})}
function wordRow(w){const fav=S.favorites.includes(w.id),learn=S.review[w.id]?.correct>0;return`<article class="word-row"><div class="word-main"><div class="word-title-line"><span class="word-title">${escapeHtml(w.en)}</span><span class="word-ipa">${escapeHtml(w.ipa)}</span></div><div class="word-meaning">${escapeHtml(S.lang==='ru'?w.ru:w.kz)} <span class="kz">${S.lang==='ru'?escapeHtml(w.kz):escapeHtml(w.ru)}</span></div><div class="word-example">${escapeHtml(w.ex)} <button class="quiet-link" data-action="speak" data-text="${escapeHtml(w.ex)}"><svg class="sound-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><g class="sound-waves" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 9a5 5 0 0 1 0 6"/><path d="M18 6a9 9 0 0 1 0 12"/></g></svg></button><div style="font:normal 10px var(--sans);color:#807968;margin-top:3px">${escapeHtml(S.lang==='ru'?w.exru:w.exkz)}</div></div><div class="word-meta"><span class="tag">${posName(w.pos)}</span><span class="tag">${t(w.cat)}</span><span class="tag">${levelText(w.level)}</span>${learn?`<span class="tag dark">✓ ${t('studied')}</span>`:''}</div></div><div class="word-ops"><button class="icon-btn fav ${fav?'on':''}" data-action="favorite" data-id="${w.id}" aria-label="${t('saveWord')}">${fav?'★':'☆'}</button>${w.custom?`<button class="icon-btn" data-action="edit-word" data-id="${w.id}" title="${t('edit')}">✎</button><button class="icon-btn" data-action="delete-word" data-id="${w.id}" title="${t('delete')}">×</button>`:''}<button class="icon-btn" data-action="speak" data-text="${escapeHtml(w.en)}" aria-label="${t('speak')}"><svg class="sound-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><g class="sound-waves" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 9a5 5 0 0 1 0 6"/><path d="M18 6a9 9 0 0 1 0 12"/></g></svg></button></div></article>`}

function dueItems(){return allWords().filter(w=>S.review[w.id]&&S.review[w.id].due<=Date.now()).sort((a,b)=>(S.review[a.id].streak||0)-(S.review[b.id].streak||0))}


function progressPage(){const total=S.attempts.length,acc=total?Math.round(S.attempts.filter(a=>a.ok).length/total*100):0;const due=dueItems();const chart=activityChart();const bycat={};S.attempts.forEach(a=>{if(!bycat[a.cat])bycat[a.cat]=[];bycat[a.cat].push(a.ok)});let cathtml=Object.entries(bycat).sort((a,b)=>b[1].length-a[1].length).slice(0,5).map(([c,a])=>`<div class="mastery-row"><div class="mastery-head"><span>${t(c)}</span><span>${Math.round(a.filter(Boolean).length/a.length*100)}%</span></div><div class="mastery-track"><span style="width:${Math.round(a.filter(Boolean).length/a.length*100)}%"></span></div></div>`).join('');const hist=S.history.slice(0,6);return`<div class="section-heading"><div><div class="eyebrow">${t('progress')}</div><h1 class="page-title">${t('progressTitle')}</h1><p>${t('progressLead')}</p></div><div style="display:flex;gap:8px"><button class="btn secondary small" data-action="goal-setting">${t("goal")}: ${S.goal}</button><button class="btn secondary small" data-action="reset">↺ ${S.lang==='ru'?'Сбросить данные':'Деректерді тазарту'}</button></div></div><div class="stats-grid">${statCard('words',Object.keys(S.review).filter(id=>S.review[id]?.correct>0).length,'⌁')}${statCard('lessons',S.completed.length,'◌')}${statCard('practiceAccuracy',acc,'↗',total?'%':'')}${statCard('practiceCount',total,'✳')}</div><div class="progress-grid"><div class="card progress-card"><h3>${t('learningRhythm')}</h3><div class="chart-wrap">${chart}</div><div class="chart-labels">${lastDays().map(d=>new Intl.DateTimeFormat(S.lang==='ru'?'ru-RU':'kk-KZ',{weekday:'short'}).format(d).replace('.','')).join('')}</div></div><div class="card progress-card"><h3>${t('topicStrength')}</h3>${cathtml||`<div class="empty-state" style="padding:27px 10px"><div class="empty-icon">◷</div><div>${t('nothingYet')}</div></div>`}</div></div><div class="card review-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h3>${t('repeatToday')}</h3><div class="tiny muted">${due.length?`${due.length} ${t('dueWords')}`:t('allClear')}</div></div><button class="btn small" data-action="start-review" ${due.length?'':'disabled'}>${t('reviewNow')} →</button></div>${due.slice(0,4).map(w=>`<div class="review-row"><strong>${escapeHtml(w.en)}</strong><span>${escapeHtml(S.lang==='ru'?w.ru:w.kz)}</span><span class="tag">${levelText(w.level)}</span></div>`).join('')}${!due.length?`<div class="notice">${t('noDue')}</div>`:''}</div><div class="card progress-card" style="margin-top:15px"><h3>${t('history')}</h3>${hist.length?`<div class="history-list">${hist.map(h=>`<div class="history-item"><span class="history-dot"></span><span>${escapeHtml(h.label|| (h.kind==='lesson'?t('lessonDone'):h.kind==='game'?t('games'):t('practiceShort')))}</span><time>${h.day} · ${h.time||''}</time></div>`).join('')}</div>`:`<div class="notice">${t('nothingYet')}</div>`}</div>`}
function lastDays(){return Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return d})}
function activityChart(){const days=lastDays().map(d=>{const key=dayKey(d);return S.history.filter(h=>h.day===key).length});const max=Math.max(1,...days),pts=days.map((n,i)=>`${i*100},${150-(n/max*120)}`).join(' ');const bars=days.map((n,i)=>`<rect x="${i*100-18}" y="${150-(n/max*120)}" width="36" height="${n/max*120}" rx="3" fill="${n?'#536e69':'#e7e1d4'}" opacity="${n?.85:.9}"/>`).join('');return`<svg viewBox="-25 0 650 170" preserveAspectRatio="none" role="img" aria-label="7 day learning activity"><path d="M-20 150H635" stroke="#ded7c8" stroke-width="1"/>${bars}<polyline points="${pts}" fill="none" stroke="#ad9160" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${days.map((n,i)=>`<circle cx="${i*100}" cy="${150-(n/max*120)}" r="${n?3:2}" fill="${n?'#ad9160':'#c9c0ae'}"/>`).join('')}</svg>`}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(x){return String(x||'').trim().toLowerCase().replace(/[.!?,'’]/g,'').replace(/\s+/g,' ')}
function toast(msg){const host=$('#toastHost');host.innerHTML=`<div class="toast">${escapeHtml(msg)}</div>`;setTimeout(()=>{const el=host.firstElementChild;if(el){el.classList.add('hide');setTimeout(()=>host.innerHTML='',350)}},2300)}
function speechAvailable(){return typeof window.speechSynthesis?.speak==='function'&&typeof SpeechSynthesisUtterance!=='undefined'}
function speak(text,button=null){const synth=window.speechSynthesis;if(!speechAvailable()){button?.classList.add('is-unavailable');toast(t('speakUnavailable'));return}if(button?.classList.contains('is-speaking')){synth.cancel();$$('.sound-control').forEach(b=>{b.classList.remove('is-speaking');b.setAttribute("aria-pressed","false")});return}synth.cancel();$$('.sound-control').forEach(b=>{b.classList.remove('is-speaking');b.setAttribute("aria-pressed","false")});const u=new SpeechSynthesisUtterance(String(text||''));u.lang='en-US';const voices=synth.getVoices?.()||[];const voice=voices.find(v=>/^en(-|_)/i.test(v.lang));if(voice)u.voice=voice;u.rate=.9;button?.classList.remove('is-unavailable');button?.classList.add('is-speaking');button?.setAttribute("aria-pressed","true");u.onstart=()=>{button?.classList.add('is-speaking');button?.setAttribute("aria-pressed","true")};u.onend=u.onerror=()=>{button?.classList.remove('is-speaking');button?.setAttribute("aria-pressed","false")};synth.speak(u)}

function quizGamePage(){const g=game,q=g.q,names=t('gameNames');const timed=g.timed;const prompt=q.isVocab?`${q.en} — ?`:q.prompt;return`<div class="section-heading"><button class="back-link" data-action="exit-game">← ${t('games')}</button></div><div class="card game-stage"><div class="game-stage-head"><div><div class="eyebrow">${names[g.type]}</div><h2>${t('round')} ${g.round}</h2></div><div class="game-score">${t('score')}: <strong>${g.score}</strong> · ${g.streak?`✳ ${g.streak}`:''}${timed?` &nbsp; · &nbsp; ${t('timeLeft')}: <strong id="gameTime">${g.time}</strong>s`:''}</div></div>${timed?`<div class="timer-bar"><span id="gameTimerBar" style="width:${g.time/g.startTime*100}%"></span></div>`:''}<div class="game-center"><div class="tiny muted">${g.type===5?t('listening'):g.type===4?t('fill'):t('question')}</div>${g.type===5?`<button class="icon-btn" style="width:54px;height:54px;font-size:20px;margin:9px" data-action="speak" data-text="${escapeHtml(q.audio)}"><svg class="sound-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><g class="sound-waves" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 9a5 5 0 0 1 0 6"/><path d="M18 6a9 9 0 0 1 0 12"/></g></svg></button><div class="tiny muted">${escapeHtml(speechAvailable()?t('listening'):t('listenFallback')+" "+q.audio)}</div>`:''}<div class="game-prompt">${escapeHtml(prompt)}</div><div class="game-options">${q.options.map(o=>`<button class="choice" style="min-width:140px;text-align:center" data-action="game-answer" data-choice="${escapeHtml(o)}">${escapeHtml(o)}</button>`).join('')}</div>${g.flash?`<div class="notice">${escapeHtml(g.flash)}</div>`:''}</div></div>`}

function makeGameQuestion(type,round){if(type===0||type===6){const pool=allWords().filter(w=>w.pos==='noun'||w.pos==='verb'||w.pos==='adj');const w=pool[Math.floor(Math.random()*pool.length)];const trans=S.lang==='ru'?x=>x.ru:x=>x.kz;const distractors=shuffle(pool.filter(x=>x.id!==w.id).map(trans)).filter((x,i,a)=>a.indexOf(x)===i&&x!==trans(w)).slice(0,3);return{isVocab:true,en:w.en,answer:trans(w),options:shuffle([trans(w),...distractors]),word:w.en,explain:`${w.en} — ${trans(w)}`}}const allowed=type===2?BANK.filter(q=>['choice','grammar','fill'].includes(q.type)):type===4?BANK.filter(q=>q.type==='fill'||q.type==='context'):type===5?BANK.filter(q=>q.type==='listening'):BANK.filter(q=>['choice','grammar','fill','context'].includes(q.type));const q=allowed[Math.floor(Math.random()*allowed.length)];return localQuestion(q)}

let questionStartedAt=Date.now(),lessonStartedAt=Date.now(),gameStartedAt=Date.now();
function statCard(label,value,icon,suffix=''){if(label==='minutes')value=Math.floor((S.studySeconds||0)/60);return`<div class="stat"><div class="stat-head"><span>${t(label)}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}<small>${suffix}</small></div></div>`}
function practicePage(){if(reviewSession&&practiceIndex>=practiceQueue.length)return`<div class="section-heading"><div><div class="eyebrow">${t('repeatToday')}</div><h1 class="page-title">${t('reviewComplete')}</h1><p>${t('allClear')}</p></div></div><div class="card exercise-card"><div class="empty-state"><div class="empty-icon">✓</div><h3>${t('reviewComplete')}</h3><p>${t('allClear')}</p><button class="btn" data-action="finish-review">${t('progress')} →</button></div></div>`;if(!practiceQueue.length||(!reviewSession&&practiceIndex>=practiceQueue.length))startPractice();const q=practiceQueue[practiceIndex%practiceQueue.length];return`<div class="section-heading"><div><div class="eyebrow">${t('practiceShort')}</div><h1 class="page-title">${t('practiceTitle')}</h1><p>${t('practiceLead')}</p></div><span class="tag dark">${dueItems().length} ${t('dueWords')}</span></div><div class="practice-layout"><div class="card exercise-card" id="exerciseCard">${renderExercise(q,practiceIndex+1)}</div><aside class="card exercise-side"><h3>${t('pickType')}</h3><div class="type-list">${Object.entries(typeNames).map(([key,name],i)=>`<div class="type-line"><span>${String(i+1).padStart(2,'0')}</span><span>${S.lang==='ru'?name:({choice:'Таңдау',translate:'Аударма',build:'Сөйлем құрау',fill:'Бос орынды толтыру',error:'Қатені түзету',match:'Сөз бен аударма',grammar:'Грамматика',synonym:'Синоним',context:'Контекст',listening:'Тыңдалым'})[key]}</span></div>`).join('')}</div><div class="notice">${dueItems().length?`${dueItems().length} ${t('dueWords')}`:t('noDue')}</div><button class="btn secondary small" style="margin-top:12px" data-action="start-review">↺ ${t('repeatToday')}</button></aside></div>`}
function startPractice(){practiceQueue=shuffle([...BANK]);practiceIndex=0;practiceResult=null;practiceBuildSelection=[];reviewSession=false;questionStartedAt=Date.now()}
function startReview(){const due=dueItems();if(!due.length){toast(t('noDue'));return}reviewSession=true;practiceQueue=due.map(w=>{const correct=S.lang==='ru'?w.ru:w.kz,other=shuffle(allWords().filter(x=>x.id!==w.id).map(x=>S.lang==='ru'?x.ru:x.kz)).filter((x,i,a)=>a.indexOf(x)===i&&x!==correct).slice(0,3);return{id:'review-'+w.id,type:'choice',prompt:`${w.en} — ?`,answer:correct,options:shuffle([correct,...other]),explain:S.lang==='ru'?`Вспомни значение слова “${w.en}”.`:`“${w.en}” сөзінің мағынасын есіңе түсір.`,word:w.en}});practiceIndex=0;practiceResult=null;practiceBuildSelection=[];questionStartedAt=Date.now();render()}
function renderExercise(source,num){const q=localQuestion(source),done=practiceResult;let body='';if(q.type==='build'){body=`<div class="builder-words" id="buildAnswer">${practiceBuildSelection.map((w,i)=>`<button class="word-chip" data-action="remove-token" data-index="${i}">${escapeHtml(w)}</button>`).join('')}</div><div class="game-options">${q.tokens.map((w,i)=>`<button class="word-chip ${practiceBuildSelection.filter(x=>x===w).length?'selected':''}" draggable="true" data-action="add-token" data-token="${escapeHtml(w)}" data-token-index="${i}">${escapeHtml(w)}</button>`).join('')}</div><div class="tiny muted" style="text-align:center;margin-top:10px">${t('scramble')}</div>`}else if(q.type==='translate'||q.type==='error'){body=`<input id="practiceInput" class="exercise-input" autocomplete="off" placeholder="${t('typeHint')}" value="${escapeHtml(done?.input||'')}">`}else if(q.type==='listening'){body=`<div style="margin:0 0 13px"><button class="btn secondary small" data-action="speak" data-text="${escapeHtml(q.audio)}"><svg class="sound-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><g class="sound-waves" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 9a5 5 0 0 1 0 6"/><path d="M18 6a9 9 0 0 1 0 12"/></g></svg> &nbsp;${t('speak')}</button></div>${speechAvailable()?"":`<div class="notice">${t("listenFallback")} ${escapeHtml(q.audio)}</div>`}<div class="exercise-options">${q.options.map(o=>choiceBtn(o,done,q.answer)).join('')}</div>`}else{body=`<div class="exercise-options">${q.options.map(o=>choiceBtn(o,done,q.answer)).join('')}</div>`}const typeLabel=S.lang==='ru'?typeNames[q.type]||typeNames.choice:({choice:'Таңдау',translate:'Аударма',build:'Сөйлем құрау',fill:'Бос орынды толтыру',error:'Қатені түзету',match:'Сөз бен аударма',grammar:'Грамматика',synonym:'Синоним',context:'Контекст',listening:'Тыңдалым'})[q.type]||'Таңдау';return`<div class="exercise-top"><span class="count">${t('exercise')} ${num}</span><span class="tag">${typeLabel}</span></div><h2>${escapeHtml(q.prompt)}</h2><p class="exercise-hint">${done?(done.ok?t('correct'):t('incorrect')):t(q.type==='translate'||q.type==='error'?'typeHint':'selectHint')}</p>${body}${done?`<div class="exercise-feedback ${done.ok?'good':'bad'}"><strong>${escapeHtml(Array.isArray(q.answer)?q.answer.join(' '):q.answer)}</strong><div style="margin-top:5px">${escapeHtml(S.lang==='ru'?q.explain:(q.explainKz||q.explain))}</div></div><div class="exercise-actions"><button class="btn" data-action="next-question">${t('nextTask')} →</button></div>`:`<div class="exercise-actions">${['translate','error'].includes(q.type)?`<button class="btn" data-action="submit-input">${t('checkAnswer')}</button>`:q.type==='build'?`<button class="btn" data-action="submit-build">${t('checkAnswer')}</button>`:''}</div>`}`}
function answerPractice(choice=null,input=null){if(practiceResult)return;const original=practiceQueue[practiceIndex%practiceQueue.length],q=localQuestion(original);let ok;if(original.type==='build')ok=JSON.stringify(practiceBuildSelection.map(x=>x.toLowerCase()))===JSON.stringify(original.answer.map(x=>x.toLowerCase()));else if(original.type==='translate'||original.type==='error')ok=[q.answer,...(original.accepted||[])].some(x=>norm(x)===norm(input));else ok=norm(choice)===norm(q.answer);practiceResult={ok,choice,input};const w=wordByText(original.word);S.studySeconds=(S.studySeconds||0)+Math.min(240,Math.max(0,Math.round((Date.now()-questionStartedAt)/1000)));questionStartedAt=Date.now();recordAnswer(w,ok,reviewSession?'review':'answer');render()}
function addPracticeToken(index){const q=practiceQueue[practiceIndex%practiceQueue.length];if(practiceResult||!q||index>=q.tokens.length)return;practiceBuildSelection.push(q.tokens[index]);render()}
function gameAnswer(choice){if(!game||game.lock)return;const g=game,q=g.q,ok=norm(choice)===norm(q.answer);g.lock=true;g.correct+=ok?1:0;g.wrong+=ok?0:1;g.streak=ok?g.streak+1:0;if(ok)g.score+=10+(g.streak>2?Math.min(5,g.streak-2):0);recordAnswer(wordByText(q.word),ok);g.flash=ok?t('correct'):`${t('incorrect')} ${q.answer}`;render();setTimeout(()=>{if(!game||game.result)return;g.round++;if(!g.timed&&g.round>10){finishGame();return}g.q=makeGameQuestion(g.type,g.round);g.lock=false;g.flash='';questionStartedAt=Date.now();render()},500)}
function finishGame(){if(!game||game.result)return;if(gameTimer){clearInterval(gameTimer);gameTimer=null}const g=game,idx=g.type,prev=S.games[idx]||{best:0,plays:0};S.games[idx]={best:Math.max(prev.best||0,g.score),plays:(prev.plays||0)+1,last:g.score};S.studySeconds=(S.studySeconds||0)+Math.min(300,Math.max(0,Math.round((Date.now()-gameStartedAt)/1000)));recordHistory('game',{label:t('gameNames')[idx],score:g.score});game={result:true,type:idx,score:g.score,round:g.round||1};save();render()}
function setPage(page){S.page=page;if(page!=='learn')S.activeLesson=null;if(page==='practice'&&!practiceQueue.length)startPractice();save();render()}
function bindLocal(){const search=$('#vocabSearch');if(search)search.addEventListener('input',()=>{vocabSearch=search.value;const rows=filteredWords();$('.word-list').innerHTML=rows.length?rows.map(wordRow).join(''):`<div class="empty-state"><div class="empty-icon">⌕</div><h3>${t('empty')}</h3><div>${t('emptyHint')}</div></div>`;$('#wordCount').textContent=`${rows.length} ${t('shown')} · ${allWords().length} ${t('words').toLowerCase()}`});[['vocabCategory',v=>vocabCategory=v],['vocabLevel',v=>vocabLevel=v],['vocabFilter',v=>vocabFilter=v]].forEach(([id,set])=>{const el=$('#'+id);if(el)el.addEventListener('change',()=>{set(el.value);render()})});$$('button[data-action="speak"]').forEach(btn=>{btn.classList.add('sound-control');const label=`${t('speak')}: ${btn.dataset.text||''}`;btn.setAttribute('aria-label',label);btn.setAttribute("aria-pressed","false");btn.title=label;if(!btn.textContent.trim())btn.classList.add("sound-icon-only")})}
function resetProgress(){if(!confirm(t('resetBody')+'\n\n'+t('resetTitle')))return;if(gameTimer)clearInterval(gameTimer);const kept={lang:S.lang,customWords:S.customWords,goal:S.goal};S={...structuredClone(defaultState),...kept};game=null;practiceQueue=[];practiceIndex=0;practiceResult=null;save();render();toast(t('resetDone'))}
function openWordModal(w){openModal(w?t('edit'):t('addWord'),wordForm(w),`<button type="button" class="btn secondary" data-action="close-modal">${t('cancel')}</button><button type="submit" form="wordForm" class="btn">${t('save')}</button>`)}
function appClick(e){const lang=e.target.closest('[data-lang]');if(lang){S.lang=lang.dataset.lang;save();render();return}const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
 if(a==='go'){setPage(el.dataset.page);return}if(a==='continue'){const c=activeLessonForHome();S.activeRoute=c.route;S.activeLesson={route:c.route,index:LESSONS[c.route].indexOf(c.lesson)};S.page='learn';lessonStartedAt=Date.now();save();render();return}
 if(a==='route'){S.activeRoute=el.dataset.route;S.activeLesson=null;render();return}if(a==='lesson'){S.activeLesson={route:S.activeRoute,index:Number(el.dataset.index)};lessonStartedAt=Date.now();render();return}if(a==='back-learn'){S.activeLesson=null;render();return}
 if(a==='lesson-answer'){const {route,index}=S.activeLesson,l=LESSONS[route][index],ok=norm(el.dataset.answer)===norm(el.dataset.correct);$$('.lesson-check .choice').forEach(b=>{b.disabled=true;if(norm(b.dataset.answer)===norm(el.dataset.correct))b.classList.add('correct');if(b===el&&!ok)b.classList.add('wrong')});const fb=$('#lessonFeedback');fb.innerHTML=`<div class="exercise-feedback ${ok?'good':'bad'}">${ok?t('correct'):t('incorrect')}<br><strong>${escapeHtml(el.dataset.correct)}</strong><div style="margin-top:5px">${escapeHtml(S.lang==='ru'?(l.note||l.explain):(l.noteKz||l.explainKz))}</div></div>`;recordAnswer(wordByText(l.words.find(x=>wordByText(x))),ok);return}
 if(a==='finish-lesson'){const route=el.dataset.route,index=Number(el.dataset.index),l=LESSONS[route][index],id=lessonId(route,l);if(!S.completed.includes(id)){S.completed.push(id);S.studySeconds=(S.studySeconds||0)+Math.min(900,Math.max(0,Math.round((Date.now()-lessonStartedAt)/1000)));recordHistory('lesson',{label:S.lang==='ru'?l.title:l.kz})}S.activeLesson=null;save();render();toast(t('lessonDone'));return}
 if(a==='favorite'){const id=el.dataset.id;if(S.favorites.includes(id)){S.favorites=S.favorites.filter(x=>x!==id);toast(t('removed'))}else{S.favorites.push(id);toast(t('saved'))}save();render();return}
 if(a==='speak'){speak(el.dataset.text||'',el);return}if(a==='add-word'){openWordModal();return}if(a==='edit-word'){openWordModal(S.customWords.find(w=>w.id===el.dataset.id));return}
 if(a==='delete-word'){if(!confirm(t('delete')+'?'))return;S.customWords=S.customWords.filter(w=>w.id!==el.dataset.id);S.favorites=S.favorites.filter(id=>id!==el.dataset.id);delete S.review[el.dataset.id];save();render();return}if(a==='close-modal'){$('#overlay').innerHTML='';return}if(a==='reset'){resetProgress();return}
 if(a==='answer-choice'){answerPractice(el.dataset.choice);return}if(a==='submit-input'){answerPractice(null,$('#practiceInput')?.value||'');return}if(a==='add-token'){addPracticeToken(Number(el.dataset.tokenIndex));return}if(a==='remove-token'){if(!practiceResult){practiceBuildSelection.splice(Number(el.dataset.index),1);render()}return}if(a==='submit-build'){answerPractice();return}
 if(a==='next-question'){practiceIndex++;practiceResult=null;practiceBuildSelection=[];questionStartedAt=Date.now();render();return}if(a==='start-review'){startReview();return}if(a==='finish-review'){reviewSession=false;practiceQueue=[];practiceIndex=0;setPage('progress');return}
 if(a==='start-game'){gameStartedAt=Date.now();questionStartedAt=Date.now();startGame(Number(el.dataset.game));return}if(a==='exit-game'){if(gameTimer)clearInterval(gameTimer);if(memoryWait)clearTimeout(memoryWait);gameTimer=memoryWait=null;game=null;render();return}if(a==='game-answer'){gameAnswer(el.dataset.choice);return}
 if(a==='builder-add'){const ix=Number(el.dataset.index);if(game&&!game.lock&&!game.used.includes(ix)){game.used.push(ix);game.selection.push(game.tokens[ix]);render()}return}if(a==='builder-remove'){const ix=Number(el.dataset.index);if(game&&!game.lock){const token=game.selection[ix];game.selection.splice(ix,1);const at=game.used.findIndex(i=>game.tokens[i]===token);if(at>=0)game.used.splice(at,1);render()}return}
 if(a==='builder-submit'){if(!game||game.lock)return;const ok=game.selection.join(' ').toLowerCase()===game.q.ans.join(' ').toLowerCase();game.lock=true;if(ok){game.score+=20;game.correct++;recordAnswer(wordByText(game.q.ans.find(x=>wordByText(x))||'learn'),true);game.flash=t('correct')}else{game.wrong++;recordAnswer(wordByText(game.q.ans.find(x=>wordByText(x))||'learn'),false);game.flash=`${t('incorrect')} ${game.q.ans.join(' ')}`}render();setTimeout(()=>{if(game&&!game.result)nextBuilder()},600);return}
 if(a==='memory-flip'){if(!game||game.lock)return;const ix=Number(el.dataset.index),card=game.cards[ix];if(card.open||card.matched)return;card.open=true;if(game.first==null){game.first=ix;render();return}const first=game.cards[game.first];game.lock=true;render();if(first.pair===card.pair){first.matched=card.matched=true;game.matches++;game.score+=20;recordAnswer(wordByText(card.word),true);game.first=null;game.lock=false;if(game.matches===4)setTimeout(()=>finishGame(),400);else render()}else{recordAnswer(wordByText(card.word),false);memoryWait=setTimeout(()=>{if(!game)return;game.cards[game.first].open=false;card.open=false;game.first=null;game.lock=false;render()},650)}return}
 if(a==='try-memory'){gameStartedAt=Date.now();startGame(3);return}if(a==='goal-setting'){openModal(t('goal'),`<div class="field" style="margin-top:18px"><label>${t('daily')} · ${t('goalDone')}</label><select id="goalValue">${[5,10,15,20].map(n=>`<option value="${n}" ${S.goal===n?'selected':''}>${n} ${t('exercise')}</option>`).join('')}</select></div>`,`<button class="btn secondary" data-action="close-modal">${t('cancel')}</button><button class="btn" data-action="save-goal">${t('save')}</button>`);return}if(a==='save-goal'){S.goal=Number($('#goalValue').value)||10;save();$('#overlay').innerHTML='';render();return}
}
function appSubmit(e){if(e.target.id!=='wordForm')return;e.preventDefault();const f=Object.fromEntries(new FormData(e.target).entries());if(!f.en.trim()||!f.ru.trim()||!f.kz.trim())return;const w={id:f.id||'u'+Date.now(),en:f.en.trim(),ru:f.ru.trim(),kz:f.kz.trim(),ipa:f.ipa.trim(),pos:'phrase',cat:f.cat||'common',level:f.level||'A',ex:f.ex.trim(),exru:f.exru.trim(),exkz:f.exkz.trim(),custom:true};if(!w.ex){w.ex=w.en+'.';w.exru=w.ru+'.';w.exkz=w.kz+'.'}const i=S.customWords.findIndex(x=>x.id===w.id);if(i>=0){S.customWords[i]=w;toast(t('wordSaved'))}else{S.customWords.push(w);toast(t('wordAdded'))}save();$('#overlay').innerHTML='';render()}
document.addEventListener('click',appClick);document.addEventListener('submit',appSubmit);document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#practiceInput')&&S.page==='practice'&&!practiceResult){e.preventDefault();answerPractice(null,$('#practiceInput').value)}});document.addEventListener('dragstart',e=>{const token=e.target.closest('[data-action="builder-add"]');if(token&&e.dataTransfer)e.dataTransfer.setData('text/plain',token.dataset.index);const p=e.target.closest('[data-action="add-token"]');if(p&&e.dataTransfer)e.dataTransfer.setData('text/plain',p.dataset.tokenIndex)});document.addEventListener('dragover',e=>{if(e.target.closest('#gameBuildAnswer,#buildAnswer'))e.preventDefault()});document.addEventListener('drop',e=>{const target=e.target.closest('#gameBuildAnswer,#buildAnswer');if(!target)return;e.preventDefault();const ix=Number(e.dataTransfer?.getData('text/plain'));if(target.id==='gameBuildAnswer'){const b=$(`[data-action="builder-add"][data-index="${ix}"]`);if(b)b.click()}else addPracticeToken(ix)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&'speechSynthesis'in window)window.speechSynthesis.cancel()});render();
</script>
</body>
